[package]
name = "livesuite_audio_quic"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring"] }
tokio = { version = "1.50", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
